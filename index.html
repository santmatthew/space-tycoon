<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Space Tycoon — Launch Logistics</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- HUD -->
    <header id="hud">
      <div class="hud-brand">🚀 <span>Space Tycoon</span></div>
      <div class="hud-stats">
        <div class="stat"><label>Cash</label><span id="hud-cash">$0</span></div>
        <div class="stat"><label>Valuation</label><span id="hud-valuation">$0</span></div>
        <div class="stat"><label>Flights</label><span id="hud-flights">0</span></div>
        <div class="stat"><label>Time</label><span id="hud-day">Day 0</span></div>
      </div>
      <div class="hud-controls">
        <div class="speed">
          <button data-speed="0" title="Pause">⏸</button>
          <button data-speed="1" class="active" title="1×">1×</button>
          <button data-speed="3" title="3×">3×</button>
          <button data-speed="8" title="8×">8×</button>
        </div>
        <button id="reset-btn" class="icon-btn" title="New game">↺</button>
      </div>
    </header>

    <!-- Solar-system map -->
    <main id="stage">
      <canvas id="map"></canvas>
      <div class="map-hint">Tap a destination to learn more</div>
    </main>

    <!-- Bottom / side panel -->
    <section id="panel">
      <nav id="tabs">
        <button data-tab="contracts" class="active">Contracts</button>
        <button data-tab="fleet">Fleet</button>
        <button data-tab="rnd">R&amp;D</button>
        <button data-tab="log">Log</button>
      </nav>
      <div id="panel-body">
        <div id="panel-contracts" class="panel active"></div>
        <div id="panel-fleet" class="panel"></div>
        <div id="panel-rnd" class="panel"></div>
        <div id="panel-log" class="panel"></div>
      </div>
    </section>
  </div>

  <div id="toast"></div>
  <div id="modal"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
